<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flara — Community</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
  :root {
    --p:#D4537E; --p50:#FBEAF0; --p100:#F4C0D1; --p600:#993556;
    --t:#1D9E75; --t50:#E1F5EE; --t100:#9FE1CB;
    --ink:#1e1510; --ink2:#6b5f55; --ink3:#b0a49c;
    --cream:#faf7f4; --white:#ffffff;
    --shadow: 0 2px 20px rgba(30,21,16,.06);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--cream); min-height: 100vh; padding-bottom: 80px; }

  .topbar { padding: 18px 20px 0; display: flex; align-items: center; justify-content: space-between; }
  .logo { font-family: 'Fraunces', serif; font-size: 20px; font-weight: 300; color: var(--p); }

  .hero { padding: 20px 20px 0; }
  .hero-title { font-size: 22px; font-weight: 500; color: var(--ink); margin-bottom: 4px; }
  .hero-title em { color: var(--p); font-style: italic; font-family: 'Fraunces', serif; font-weight: 300; }
  .hero-sub { font-size: 13px; color: var(--ink2); }

  /* Compose */
  .compose { margin: 16px 20px 0; background: var(--white); border-radius: 18px; padding: 14px; box-shadow: var(--shadow); border: 0.5px solid rgba(30,21,16,.06); }
  .compose-top { display: flex; gap: 10px; align-items: flex-start; }
  .avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--p100); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 500; color: var(--p600); flex-shrink: 0; }
  .compose-textarea { flex: 1; border: none; outline: none; resize: none; font-family: 'DM Sans', sans-serif; font-size: 14px; color: var(--ink); background: transparent; line-height: 1.6; min-height: 60px; }
  .compose-textarea::placeholder { color: var(--ink3); }
  .compose-bottom { display: flex; justify-content: flex-end; margin-top: 10px; padding-top: 10px; border-top: 0.5px solid rgba(30,21,16,.06); gap: 8px; align-items: center; }
  .char-count { font-size: 11px; color: var(--ink3); }
  .post-btn { padding: 9px 20px; background: var(--p); color: #fff; border: none; border-radius: 10px; font-family: inherit; font-size: 13px; font-weight: 500; cursor: pointer; transition: opacity .15s; }
  .post-btn:hover { opacity: .88; }
  .post-btn:disabled { opacity: .4; cursor: not-allowed; }

  /* Filters */
  .filters { padding: 14px 20px 0; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
  .filters::-webkit-scrollbar { display: none; }
  .filter-btn { border: 0.5px solid rgba(30,21,16,.1); border-radius: 99px; padding: 7px 14px; font-size: 12px; font-weight: 500; color: var(--ink2); cursor: pointer; background: var(--white); white-space: nowrap; font-family: inherit; transition: all .15s; flex-shrink: 0; }
  .filter-btn.active { background: var(--p); border-color: var(--p); color: #fff; }

  /* Posts */
  .posts { padding: 12px 20px 0; display: flex; flex-direction: column; gap: 10px; }

  .post { background: var(--white); border-radius: 18px; padding: 16px; box-shadow: var(--shadow); border: 0.5px solid rgba(30,21,16,.06); }
  .post-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .post-avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--p100); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 500; color: var(--p600); flex-shrink: 0; }
  .post-avatar.teal { background: var(--t50); color: #085041; }
  .post-avatar.amber { background: #FAEEDA; color: #633806; }
  .post-avatar.gray { background: #F1EFE8; color: #5F5E5A; }
  .post-meta { flex: 1; }
  .post-name { font-size: 13px; font-weight: 500; color: var(--ink); }
  .post-time { font-size: 11px; color: var(--ink3); }
  .cond-pill { font-size: 10px; font-weight: 500; padding: 2px 8px; border-radius: 99px; background: var(--p50); color: var(--p600); flex-shrink: 0; }
  .cond-pill.endo { background: var(--t50); color: #085041; }
  .cond-pill.fibro { background: #FAEEDA; color: #633806; }
  .cond-pill.other { background: #F1EFE8; color: #5F5E5A; }

  .post-content { font-size: 14px; color: var(--ink); line-height: 1.65; margin-bottom: 12px; }

  .post-footer { display: flex; align-items: center; gap: 14px; }
  .like-btn { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--ink3); background: none; border: none; cursor: pointer; font-family: inherit; padding: 4px 0; transition: color .15s; }
  .like-btn.liked { color: var(--p); }
  .like-btn:hover { color: var(--p); }
  .like-btn i { font-size: 16px; }
  .reply-toggle-btn { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--ink3); background: none; border: none; cursor: pointer; font-family: inherit; padding: 4px 0; transition: color .15s; }
  .reply-toggle-btn:hover { color: var(--t); }
  .reply-toggle-btn i { font-size: 16px; }
  .delete-btn { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--ink3); background: none; border: none; cursor: pointer; font-family: inherit; padding: 4px 0; margin-left: auto; transition: color .15s; }
  .delete-btn:hover { color: #A32D2D; }
  .delete-btn i { font-size: 16px; }

  /* Replies */
  .replies-section { margin-top: 12px; padding-top: 12px; border-top: 0.5px solid rgba(30,21,16,.06); display: none; }
  .replies-section.open { display: block; }
  .reply { display: flex; gap: 8px; margin-bottom: 10px; }
  .reply-avatar { width: 26px; height: 26px; border-radius: 50%; background: var(--t50); display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 500; color: #085041; flex-shrink: 0; margin-top: 1px; }
  .reply-body { flex: 1; }
  .reply-name { font-size: 12px; font-weight: 500; color: var(--ink); }
  .reply-time { font-size: 10px; color: var(--ink3); margin-left: 6px; }
  .reply-text { font-size: 13px; color: var(--ink2); line-height: 1.55; margin-top: 2px; }

  /* Reply compose */
  .reply-compose { display: flex; gap: 8px; align-items: flex-end; margin-top: 10px; }
  .reply-compose .reply-avatar { margin-top: 0; }
  .reply-input-wrap { flex: 1; background: var(--cream); border-radius: 12px; padding: 8px 12px; display: flex; align-items: center; gap: 8px; }
  .reply-input { flex: 1; border: none; outline: none; background: transparent; font-family: 'DM Sans', sans-serif; font-size: 13px; color: var(--ink); }
  .reply-input::placeholder { color: var(--ink3); }
  .reply-send-btn { width: 30px; height: 30px; border-radius: 50%; background: var(--p); border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #fff; font-size: 14px; flex-shrink: 0; transition: opacity .15s; }
  .reply-send-btn:hover { opacity: .85; }
  .reply-send-btn:disabled { opacity: .4; cursor: not-allowed; }

  /* Empty */
  .no-replies { font-size: 12px; color: var(--ink3); font-style: italic; margin-bottom: 10px; }

  /* Loading */
  .loading-state { text-align: center; padding: 40px 20px; color: var(--ink3); font-size: 13px; }
  .spinner { width: 28px; height: 28px; border-radius: 50%; border: 2.5px solid var(--p100); border-top-color: var(--p); animation: spin .8s linear infinite; margin: 0 auto 12px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Toast */
  #toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 20px; border-radius: 10px; font-size: 13px; font-weight: 500; opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 999; white-space: nowrap; }
  #toast.show { opacity: 1; }

  /* Bottom nav */
  .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--white); border-top: 0.5px solid rgba(30,21,16,.08); display: flex; padding: 8px 0 4px; z-index: 100; }
  .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; padding: 4px; color: var(--ink3); font-size: 10px; font-weight: 500; border: none; background: none; font-family: inherit; transition: color .15s; }
  .nav-item i { font-size: 20px; }
  .nav-item.active { color: var(--p); }
  .nav-fab-wrap { flex: 1; display: flex; justify-content: center; }
  .nav-fab { width: 46px; height: 46px; border-radius: 50%; background: var(--p); border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #fff; font-size: 22px; margin-top: -18px; box-shadow: 0 4px 16px rgba(212,83,126,.35); font-family: inherit; }
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">flara</div>
</div>

<div class="hero">
  <div class="hero-title">Community <em>support</em></div>
  <div class="hero-sub">Anonymous, safe space for women with chronic conditions</div>
</div>

<div class="compose">
  <div class="compose-top">
    <div class="avatar" id="composeAvatar">?</div>
    <textarea class="compose-textarea" id="postInput" placeholder="Share something — a win, a struggle, a tip…" maxlength="300" rows="3"></textarea>
  </div>
  <div class="compose-bottom">
    <span class="char-count" id="charCount">0 / 300</span>
    <button class="post-btn" id="postBtn" disabled>Post</button>
  </div>
</div>

<div class="filters">
  <button class="filter-btn active" data-f="all">All</button>
  <button class="filter-btn" data-f="pcos">PCOS</button>
  <button class="filter-btn" data-f="endo">Endometriosis</button>
  <button class="filter-btn" data-f="fibro">Fibromyalgia</button>
</div>

<div class="posts" id="postsContainer">
  <div class="loading-state"><div class="spinner"></div>Loading posts…</div>
</div>

<div id="toast"></div>

<nav class="bottom-nav">
  <button class="nav-item" onclick="window.location.href='/dashboard'"><i class="ti ti-home"></i>Home</button>
  <button class="nav-item" onclick="window.location.href='/trends'"><i class="ti ti-chart-line"></i>Trends</button>
  <div class="nav-fab-wrap"><button class="nav-fab" onclick="window.location.href='/log'"><i class="ti ti-plus"></i></button></div>
  <button class="nav-item active"><i class="ti ti-users"></i>Community</button>
  <button class="nav-item" onclick="window.location.href='/profile'"><i class="ti ti-user"></i>Profile</button>
</nav>

<script>
const SUPABASE_URL = 'https://eksywmdtyjhfnrvxmdku.supabase.co';
const SUPABASE_KEY = 'sb_publishable_LGlQ_iISN3DmP5lto2QCKA_2yP2OMQe';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: { detectSessionInUrl: true, persistSession: true, autoRefreshToken: true }
});

let userId = null, userDisplayName = '', userCondition = 'pcos';
let allPosts = [], allReplies = {}, likedPosts = new Set(), activeFilter = 'all';

/* ── helpers ── */
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function timeAgo(dateStr) {
  const diff = (Date.now() - new Date(dateStr)) / 1000;
  if (diff < 60) return 'just now';
  if (diff < 3600) return Math.floor(diff/60) + 'm ago';
  if (diff < 86400) return Math.floor(diff/3600) + 'h ago';
  return Math.floor(diff/86400) + 'd ago';
}

function condLabel(c) {
  return { pcos:'PCOS', endo:'Endometriosis', fibro:'Fibromyalgia', other:'Other' }[c] || 'Other';
}

const avatarColors = ['', 'teal', 'amber', 'gray'];
function avatarColor(str) {
  let hash = 0;
  for (let i=0; i<str.length; i++) hash = str.charCodeAt(i) + ((hash<<5)-hash);
  return avatarColors[Math.abs(hash) % avatarColors.length];
}

function initials(name) {
  if (!name) return '?';
  return name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
}

/* ── render replies ── */
function renderReplies(postId) {
  const replies = allReplies[postId] || [];
  const userInitials = initials(userDisplayName);
  const userAvatarColor = avatarColor(userId || '');

  let html = '';
  if (!replies.length) {
    html += `<div class="no-replies">No replies yet — be the first to respond.</div>`;
  } else {
    html += replies.map(r => {
      const isOwn = r.user_id === userId;
      const displayName = isOwn ? userDisplayName : r.author_name;
      const ini = initials(displayName);
      const col = avatarColor(r.user_id || '');
      return `<div class="reply">
        <div class="reply-avatar ${col}">${ini}</div>
        <div class="reply-body">
          <span class="reply-name">${displayName}</span>
          <span class="reply-time">${timeAgo(r.created_at)}</span>
          <div class="reply-text">${r.content}</div>
        </div>
      </div>`;
    }).join('');
  }

  // Reply compose box
  html += `<div class="reply-compose">
    <div class="reply-avatar ${userAvatarColor}">${userInitials}</div>
    <div class="reply-input-wrap">
      <input class="reply-input" id="replyInput-${postId}" placeholder="Reply…" maxlength="200">
      <button class="reply-send-btn" onclick="submitReply('${postId}')" title="Send">
        <i class="ti ti-send"></i>
      </button>
    </div>
  </div>`;

  return html;
}

/* ── render posts ── */
function renderPosts() {
  const container = document.getElementById('postsContainer');
  const filtered = activeFilter === 'all' ? allPosts : allPosts.filter(p => p.condition === activeFilter);

  if (!filtered.length) {
    container.innerHTML = `<div class="loading-state">
      <div style="font-size:32px;margin-bottom:10px">🌸</div>
      <div style="font-size:13px;color:var(--ink2)">No posts here yet.<br>Be the first to share something.</div>
    </div>`;
    return;
  }

  container.innerHTML = filtered.map(p => {
    const isOwn = p.user_id === userId;
    const displayName = isOwn ? userDisplayName : p.author_name;
    const ini = initials(displayName);
    const col = avatarColor(p.user_id || '');
    const liked = likedPosts.has(p.id);
    const replyCount = (allReplies[p.id] || []).length;

    return `<div class="post" id="post-${p.id}">
      <div class="post-header">
        <div class="post-avatar ${col}">${ini}</div>
        <div class="post-meta">
          <div class="post-name">${displayName}${isOwn ? ' <span style="font-size:10px;color:var(--ink3)">(you)</span>' : ''}</div>
          <div class="post-time">${timeAgo(p.created_at)}</div>
        </div>
        <span class="cond-pill ${p.condition}">${condLabel(p.condition)}</span>
      </div>

      <div class="post-content">${p.content}</div>

      <div class="post-footer">
        <button class="like-btn ${liked?'liked':''}" onclick="toggleLike('${p.id}')">
          <i class="ti ti-heart${liked?'-filled':''}"></i>
          <span id="likes-${p.id}">${p.likes || 0}</span>
        </button>
        <button class="reply-toggle-btn" onclick="toggleReplies('${p.id}')">
          <i class="ti ti-message-circle"></i>
          <span id="reply-count-${p.id}">${replyCount} ${replyCount===1?'reply':'replies'}</span>
        </button>
        ${isOwn ? `<button class="delete-btn" onclick="deletePost('${p.id}')">
          <i class="ti ti-trash"></i>
        </button>` : ''}
      </div>

      <div class="replies-section" id="replies-${p.id}">
        ${renderReplies(p.id)}
      </div>
    </div>`;
  }).join('');
}

/* ── toggle replies ── */
function toggleReplies(postId) {
  const section = document.getElementById(`replies-${postId}`);
  const isOpen = section.classList.contains('open');
  section.classList.toggle('open', !isOpen);
  if (!isOpen) {
    // focus the reply input
    setTimeout(() => {
      const input = document.getElementById(`replyInput-${postId}`);
      if (input) input.focus();
    }, 50);
  }
}

/* ── submit reply ── */
async function submitReply(postId) {
  const input = document.getElementById(`replyInput-${postId}`);
  const content = input.value.trim();
  if (!content) return;

  const btn = input.nextElementSibling;
  btn.disabled = true;
  input.disabled = true;

  const { data, error } = await sb.from('community_replies').insert({
    post_id: postId,
    user_id: userId,
    author_name: userDisplayName,
    content
  }).select().single();

  btn.disabled = false;
  input.disabled = false;

  if (error) { toast('Something went wrong'); return; }

  if (!allReplies[postId]) allReplies[postId] = [];
  allReplies[postId].push(data);

  // Update reply count label
  const count = allReplies[postId].length;
  const countEl = document.getElementById(`reply-count-${postId}`);
  if (countEl) countEl.textContent = `${count} ${count===1?'reply':'replies'}`;

  // Re-render replies section
  const section = document.getElementById(`replies-${postId}`);
  if (section) {
    section.innerHTML = renderReplies(postId);
    section.classList.add('open');
  }

  input.value = '';
  toast('Reply posted 🌸');
}

/* ── delete post ── */
async function deletePost(postId) {
  if (!confirm('Delete this post? This will also remove all its replies and cannot be undone.')) return;

  const { error } = await sb.from('community_posts').delete().eq('id', postId).eq('user_id', userId);
  if (error) { toast('Could not delete — try again'); return; }

  allPosts = allPosts.filter(p => p.id !== postId);
  delete allReplies[postId];
  renderPosts();
  toast('Post deleted');
}

/* ── like toggle ──
   Uses the increment_post_likes RPC (SECURITY DEFINER, delta must be +1/-1)
   instead of a direct table UPDATE, since RLS no longer permits non-owners
   to update other users' community_posts rows directly. */
async function toggleLike(postId) {
  if (!userId) return;
  const liked = likedPosts.has(postId);
  const post = allPosts.find(p => p.id === postId);
  if (!post) return;

  const delta = liked ? -1 : 1;
  const btn = document.querySelector(`#post-${postId} .like-btn`);

  // Optimistic UI update
  if (liked) { likedPosts.delete(postId); } else { likedPosts.add(postId); }
  if (btn) {
    btn.classList.toggle('liked', !liked);
    btn.querySelector('i').className = `ti ti-heart${!liked?'-filled':''}`;
  }

  try {
    if (liked) {
      const { error } = await sb.from('community_likes').delete().eq('post_id', postId).eq('user_id', userId);
      if (error) throw error;
    } else {
      const { error } = await sb.from('community_likes').insert({ post_id: postId, user_id: userId });
      if (error) throw error;
    }

    const { data: newCount, error: rpcError } = await sb.rpc('increment_post_likes', {
      post_id: postId,
      delta
    });
    if (rpcError) throw rpcError;

    post.likes = newCount;
    const count = document.getElementById(`likes-${postId}`);
    if (count) count.textContent = post.likes;

  } catch (e) {
    console.error(e);
    // Revert optimistic UI on failure
    if (liked) { likedPosts.add(postId); } else { likedPosts.delete(postId); }
    if (btn) {
      btn.classList.toggle('liked', liked);
      btn.querySelector('i').className = `ti ti-heart${liked?'-filled':''}`;
    }
    toast('Could not update like — try again');
  }
}

/* ── submit post ── */
async function submitPost() {
  const input = document.getElementById('postInput');
  const content = input.value.trim();
  if (!content) return;

  const btn = document.getElementById('postBtn');
  btn.disabled = true; btn.textContent = 'Posting…';

  const { data, error } = await sb.from('community_posts').insert({
    user_id: userId,
    author_name: userDisplayName,
    condition: userCondition,
    content,
    likes: 0
  }).select().single();

  btn.disabled = true; btn.textContent = 'Post';

  if (error) { toast('Something went wrong'); btn.disabled = false; return; }

  allReplies[data.id] = [];
  allPosts.unshift(data);
  input.value = '';
  document.getElementById('charCount').textContent = '0 / 300';
  renderPosts();
  toast('Posted! 🌸');
}

/* ── compose listeners ── */
document.getElementById('postInput').addEventListener('input', function() {
  const len = this.value.length;
  document.getElementById('charCount').textContent = `${len} / 300`;
  document.getElementById('postBtn').disabled = len === 0;
});
document.getElementById('postBtn').addEventListener('click', submitPost);

/* ── filter listeners ── */
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeFilter = btn.dataset.f;
    renderPosts();
  });
});

/* ── boot ── */
(async () => {
  const { data:{ session } } = await sb.auth.getSession();
  if (!session) { window.location.href = '/'; return; }
  userId = session.user.id;

  const { data: profile } = await sb.from('profiles').select('name, condition').eq('id', userId).single();
  userDisplayName = profile?.name || session.user.user_metadata?.full_name || 'Anonymous';
  userCondition   = profile?.condition || 'pcos';

  const ini = initials(userDisplayName);
  document.getElementById('composeAvatar').textContent = ini;

  // Load posts + likes + replies in parallel
  const [{ data: posts }, { data: likes }, { data: replies }] = await Promise.all([
    sb.from('community_posts').select('*').order('created_at', { ascending: false }),
    sb.from('community_likes').select('post_id').eq('user_id', userId),
    sb.from('community_replies').select('*').order('created_at', { ascending: true })
  ]);

  allPosts = posts || [];
  if (likes) likes.forEach(l => likedPosts.add(l.post_id));

  // Group replies by post_id
  (replies || []).forEach(r => {
    if (!allReplies[r.post_id]) allReplies[r.post_id] = [];
    allReplies[r.post_id].push(r);
  });

  renderPosts();
})();
</script>
</body>
</html>
