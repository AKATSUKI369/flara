<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flara — How are you feeling today?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,400;1,300&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --rose:    #e8746a;
    --rose-lt: #fdf0ef;
    --rose-md: #f5cbc7;
    --sage:    #7a9e87;
    --cream:   #faf7f4;
    --ink:     #2a2118;
    --ink-2:   #6b5f55;
    --ink-3:   #a89e96;
    --white:   #ffffff;
    --radius:  16px;
    --shadow:  0 2px 20px rgba(42,33,24,.07);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--cream);
    color: var(--ink);
    min-height: 100vh;
    padding-bottom: 120px;
  }
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 24px 0;
  }
  .logo {
    font-family: 'Fraunces', serif;
    font-size: 22px; font-weight: 300; color: var(--rose);
    letter-spacing: -.5px;
  }
  .streak {
    display: flex; align-items: center; gap: 6px;
    font-size: 13px; color: var(--ink-2);
    background: var(--white); border-radius: 99px;
    padding: 6px 14px; box-shadow: var(--shadow);
  }
  .streak-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--rose); }
  .greeting { padding: 28px 24px 0; }
  .greeting-date {
    font-size: 12px; font-weight: 500; color: var(--ink-3);
    text-transform: uppercase; letter-spacing: .08em; margin-bottom: 6px;
  }
  .greeting-title {
    font-family: 'Fraunces', serif;
    font-size: 28px; font-weight: 300; line-height: 1.25; color: var(--ink);
  }
  .greeting-title em { font-style: italic; color: var(--rose); }
  .form { padding: 28px 24px 0; display: flex; flex-direction: column; gap: 20px; }
  .card { background: var(--white); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); }
  .card-label {
    font-size: 12px; font-weight: 500; color: var(--ink-3);
    text-transform: uppercase; letter-spacing: .07em;
    margin-bottom: 14px; display: flex; align-items: center; gap: 8px;
  }
  .card-label .icon { font-size: 16px; }

  /* Sliders */
  .slider-row { display: flex; align-items: center; gap: 12px; }
  .slider-val {
    font-family: 'Fraunces', serif;
    font-size: 28px; font-weight: 300; color: var(--rose);
    min-width: 32px; text-align: center;
  }
  input[type=range] {
    flex: 1; -webkit-appearance: none; appearance: none;
    height: 6px; border-radius: 99px; outline: none; cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--white); border: 2px solid var(--rose);
    box-shadow: 0 2px 8px rgba(232,116,106,.3); cursor: pointer;
  }
  input[type=range]::-moz-range-thumb {
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--white); border: 2px solid var(--rose);
    box-shadow: 0 2px 8px rgba(232,116,106,.3); cursor: pointer;
  }
  .slider-labels {
    display: flex; justify-content: space-between;
    font-size: 11px; color: var(--ink-3); margin-top: 6px;
  }

  /* Mood */
  .mood-row { display: flex; justify-content: space-between; gap: 6px; }
  .mood-btn {
    flex: 1; border: 1.5px solid transparent;
    border-radius: 12px; padding: 10px 4px;
    background: var(--cream); cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    transition: all .15s; font-size: 22px; font-family: inherit;
  }
  .mood-btn .label { font-size: 10px; font-weight: 500; color: var(--ink-3); }
  .mood-btn.active { background: var(--rose-lt); border-color: var(--rose); }

  /* Chips */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    border: 1.5px solid var(--rose-md); border-radius: 99px; padding: 7px 14px;
    font-size: 13px; color: var(--ink-2); cursor: pointer; background: var(--white);
    transition: all .15s; user-select: none; font-family: inherit;
  }
  .chip.active { background: var(--rose); border-color: var(--rose); color: var(--white); }

  /* Sleep stepper */
  .num-row { display: flex; align-items: center; gap: 14px; }
  .num-btn {
    width: 36px; height: 36px; border-radius: 50%;
    border: 1.5px solid var(--rose-md); background: var(--white);
    font-size: 20px; color: var(--rose); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all .15s; font-family: inherit; line-height: 1;
  }
  .num-btn:hover { background: var(--rose-lt); }
  .num-val {
    font-family: 'Fraunces', serif;
    font-size: 28px; font-weight: 300; color: var(--ink);
    min-width: 52px; text-align: center;
  }
  .num-unit { font-size: 13px; color: var(--ink-3); }

  /* Cycle days */
  .cycle-scroll {
    display: flex; gap: 8px;
    overflow-x: scroll; -webkit-overflow-scrolling: touch;
    padding-bottom: 6px; scrollbar-width: none;
    width: 100%; flex-wrap: nowrap;
  }
  .cycle-scroll::-webkit-scrollbar { display: none; }
  .cycle-day {
    width: 40px; height: 40px; border-radius: 50%;
    border: 1.5px solid var(--rose-md); background: var(--white);
    font-size: 13px; color: var(--ink-2); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex: 0 0 40px; transition: all .15s;
  }
  .cycle-day.active { background: var(--rose); border-color: var(--rose); color: var(--white); font-weight: 500; }

  /* Notes */
  textarea {
    width: 100%; border: 1.5px solid var(--rose-md);
    border-radius: 12px; padding: 14px;
    font-family: 'DM Sans', sans-serif; font-size: 14px;
    color: var(--ink); background: var(--cream);
    resize: none; outline: none; line-height: 1.6;
    transition: border-color .15s;
  }
  textarea:focus { border-color: var(--rose); background: var(--white); }
  textarea::placeholder { color: var(--ink-3); }

  /* Submit */
  .submit-wrap { padding: 0 24px; }
  .submit-btn {
    width: 100%; padding: 18px;
    background: var(--rose); color: var(--white);
    border: none; border-radius: var(--radius);
    font-family: 'DM Sans', sans-serif; font-size: 16px; font-weight: 500;
    cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;
    box-shadow: 0 4px 20px rgba(232,116,106,.35);
    transition: all .2s;
  }
  .submit-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 24px rgba(232,116,106,.45); }
  .submit-btn:disabled { opacity: .6; cursor: not-allowed; transform: none; }

  /* Insight */
  .insight-card {
    margin: 24px 24px 0;
    background: linear-gradient(135deg, #2a2118 0%, #3d3028 100%);
    border-radius: var(--radius); padding: 22px; display: none;
  }
  .insight-card.visible { display: block; animation: slideUp .4s ease; }
  @keyframes slideUp { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
  .insight-label {
    font-size: 11px; font-weight: 500; color: var(--rose);
    text-transform: uppercase; letter-spacing: .08em; margin-bottom: 10px;
  }
  .insight-text {
    font-family: 'Fraunces', serif; font-style: italic;
    font-size: 17px; font-weight: 300; line-height: 1.6; color: #f0ebe6;
  }

  /* Loading dots */
  .dots { display: inline-flex; gap: 4px; margin-left: 6px; vertical-align: middle; }
  .dots span {
    width: 5px; height: 5px; border-radius: 50%; background: currentColor;
    display: inline-block; animation: blink 1.2s infinite;
  }
  .dots span:nth-child(2) { animation-delay: .2s; }
  .dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%,80%,100%{opacity:.2} 40%{opacity:1} }

  /* Toast */
  .toast {
    position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%) translateY(80px);
    background: var(--ink); color: var(--white);
    padding: 12px 22px; border-radius: 99px;
    font-size: 14px; font-weight: 500; z-index: 100;
    transition: transform .3s ease; white-space: nowrap;
    pointer-events: none;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .disclaimer { font-size: 11px; color: var(--ink-3); text-align: center; padding: 16px 24px 0; line-height: 1.6; }
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">flara</div>
  <div class="streak">
    <div class="streak-dot"></div>
    <span id="streakText">Day 1 🔥</span>
  </div>
</div>

<div class="greeting">
  <div class="greeting-date" id="dateLabel"></div>
  <div class="greeting-title">How are you<br>feeling <em>today?</em></div>
</div>

<div class="form">

  <!-- Pain -->
  <div class="card">
    <div class="card-label"><span class="icon">🌡</span> Pain level</div>
    <div class="slider-row">
      <input type="range" id="painSlider" min="0" max="10" value="3">
      <div class="slider-val" id="painVal">3</div>
    </div>
    <div class="slider-labels"><span>None</span><span>Mild</span><span>Moderate</span><span>Severe</span></div>
  </div>

  <!-- Energy -->
  <div class="card">
    <div class="card-label"><span class="icon">⚡</span> Energy level</div>
    <div class="slider-row">
      <input type="range" id="energySlider" min="0" max="10" value="5">
      <div class="slider-val" id="energyVal">5</div>
    </div>
    <div class="slider-labels"><span>Exhausted</span><span>Low</span><span>Okay</span><span>Great</span></div>
  </div>

  <!-- Mood -->
  <div class="card">
    <div class="card-label"><span class="icon">🌸</span> Mood</div>
    <div class="mood-row" id="moodRow">
      <button class="mood-btn" data-val="2">😞<span class="label">Low</span></button>
      <button class="mood-btn" data-val="4">😕<span class="label">Meh</span></button>
      <button class="mood-btn active" data-val="6">😐<span class="label">Okay</span></button>
      <button class="mood-btn" data-val="8">🙂<span class="label">Good</span></button>
      <button class="mood-btn" data-val="10">😊<span class="label">Great</span></button>
    </div>
  </div>

  <!-- Sleep -->
  <div class="card">
    <div class="card-label"><span class="icon">🌙</span> Sleep last night</div>
    <div class="num-row">
      <button class="num-btn" id="sleepMinus">−</button>
      <div class="num-val" id="sleepVal">7.0</div>
      <div class="num-unit">hours</div>
      <button class="num-btn" id="sleepPlus">+</button>
    </div>
  </div>

  <!-- Cycle day -->
  <div class="card">
    <div class="card-label"><span class="icon">🌒</span> Cycle day <span style="font-size:11px;color:var(--ink-3);text-transform:none;font-weight:400;letter-spacing:0;margin-left:4px">(scroll)</span></div>
    <div class="cycle-scroll" id="cycleScroll"></div>
  </div>

  <!-- Symptoms -->
  <div class="card">
    <div class="card-label"><span class="icon">📍</span> Symptoms today</div>
    <div class="chips" id="chipsContainer">
      <button class="chip" data-key="bloating">Bloating</button>
      <button class="chip" data-key="headache">Headache</button>
      <button class="chip" data-key="brain_fog">Brain fog</button>
      <button class="chip" data-key="cramps">Cramps</button>
      <button class="chip" data-key="nausea">Nausea</button>
      <button class="chip" data-key="fatigue">Fatigue</button>
      <button class="chip" data-key="acne">Acne</button>
      <button class="chip" data-key="anxiety">Anxiety</button>
      <button class="chip" data-key="none">None today 🎉</button>
    </div>
  </div>

  <!-- Notes -->
  <div class="card">
    <div class="card-label"><span class="icon">✏️</span> Anything else? <span style="font-size:11px;color:var(--ink-3);text-transform:none;font-weight:400;letter-spacing:0;margin-left:4px">(optional)</span></div>
    <textarea id="notes" rows="3" placeholder="Stress, food, exercise, how work went…"></textarea>
  </div>

</div>

<div style="height:20px"></div>
<div class="submit-wrap">
  <button class="submit-btn" id="submitBtn">
    <span id="submitLabel">Save today's log</span>
  </button>
</div>

<div class="insight-card" id="insightCard">
  <div class="insight-label">✦ Flara insight</div>
  <div class="insight-text" id="insightText"></div>
</div>

<p class="disclaimer">Not medical advice. Always consult your doctor.</p>
<div class="toast" id="toast"></div>

<!-- Supabase loaded LAST so UI works even if it fails -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ── CONFIG ──────────────────────────────────────────
const SUPABASE_URL = 'https://your-project.supabase.co';  // ← paste your actual URL here
const SUPABASE_KEY = 'your-anon-key-here';                // ← paste your anon key here
// ────────────────────────────────────────────────────

// State
const state = {
  pain_level: 3, energy_level: 5, mood: 6,
  sleep_hours: 7.0, cycle_day: null,
  bloating: false, headache: false, brain_fog: false
};

// ── Date label ──
const now = new Date();
document.getElementById('dateLabel').textContent =
  now.toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric' });

// ── Sliders ──
function setSliderGradient(el, val) {
  const pct = (val / 10) * 100;
  el.style.background =
    `linear-gradient(to right,#e8746a 0%,#e8746a ${pct}%,#f5cbc7 ${pct}%,#f5cbc7 100%)`;
}

const painSlider = document.getElementById('painSlider');
const painVal    = document.getElementById('painVal');
setSliderGradient(painSlider, 3);
painSlider.addEventListener('input', function() {
  state.pain_level = parseInt(this.value);
  painVal.textContent = this.value;
  setSliderGradient(this, this.value);
});

const energySlider = document.getElementById('energySlider');
const energyVal    = document.getElementById('energyVal');
setSliderGradient(energySlider, 5);
energySlider.addEventListener('input', function() {
  state.energy_level = parseInt(this.value);
  energyVal.textContent = this.value;
  setSliderGradient(this, this.value);
});

// ── Mood ──
document.getElementById('moodRow').addEventListener('click', function(e) {
  const btn = e.target.closest('.mood-btn');
  if (!btn) return;
  state.mood = parseInt(btn.dataset.val);
  document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
});

// ── Sleep stepper ──
document.getElementById('sleepMinus').addEventListener('click', function() {
  state.sleep_hours = Math.max(0, +(state.sleep_hours - 0.5).toFixed(1));
  document.getElementById('sleepVal').textContent = state.sleep_hours.toFixed(1);
});
document.getElementById('sleepPlus').addEventListener('click', function() {
  state.sleep_hours = Math.min(24, +(state.sleep_hours + 0.5).toFixed(1));
  document.getElementById('sleepVal').textContent = state.sleep_hours.toFixed(1);
});

// ── Cycle days ──
const cycleScroll = document.getElementById('cycleScroll');
for (let d = 1; d <= 35; d++) {
  const btn = document.createElement('button');
  btn.className = 'cycle-day';
  btn.textContent = d;
  btn.addEventListener('click', function() {
    state.cycle_day = d;
    document.querySelectorAll('.cycle-day').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
  });
  cycleScroll.appendChild(btn);
}

// ── Chips ──
const activeChips = new Set();
document.getElementById('chipsContainer').addEventListener('click', function(e) {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  const key = chip.dataset.key;
  if (key === 'none') {
    activeChips.clear();
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  } else {
    activeChips.has(key) ? activeChips.delete(key) : activeChips.add(key);
    chip.classList.toggle('active');
  }
  state.bloating  = activeChips.has('bloating');
  state.headache  = activeChips.has('headache');
  state.brain_fog = activeChips.has('brain_fog');
});

// ── Toast ──
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

// ── Submit ──
document.getElementById('submitBtn').addEventListener('click', async function() {
  const btn = this;
  const lbl = document.getElementById('submitLabel');
  btn.disabled = true;
  lbl.innerHTML = 'Saving<span class="dots"><span></span><span></span><span></span></span>';

  const notes = document.getElementById('notes').value;

  try {
    // Init Supabase
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Check auth
    const { data: { user } } = await sb.auth.getUser();
    if (!user) { window.location.href = '/login.html'; return; }

    // Save to Supabase
    const { data: log, error } = await sb.from('symptom_logs').insert({
      user_id:      user.id,
      log_date:     new Date().toISOString().split('T')[0],
      pain_level:   state.pain_level,
      energy_level: state.energy_level,
      mood:         state.mood,
      sleep_hours:  state.sleep_hours,
      cycle_day:    state.cycle_day,
      bloating:     state.bloating,
      headache:     state.headache,
      brain_fog:    state.brain_fog,
      notes
    }).select().single();

    if (error) throw error;

    // Get AI insight
    lbl.innerHTML = 'Getting insight<span class="dots"><span></span><span></span><span></span></span>';
    const res = await fetch('/api/save-log', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ logId: log.id, userId: user.id, logData: { ...state, notes } })
    });
    const { insight } = await res.json();

    // Update log with insight
    await sb.from('symptom_logs').update({ ai_insight: insight }).eq('id', log.id);

    // Show insight
    document.getElementById('insightText').textContent = insight;
    const card = document.getElementById('insightCard');
    card.classList.add('visible');
    card.scrollIntoView({ behavior: 'smooth', block: 'center' });

    lbl.textContent = '✓ Saved';
    btn.style.background = 'var(--sage)';
    showToast('Log saved! ✓');

  } catch (err) {
    console.error(err);
    lbl.textContent = "Save today's log";
    btn.disabled = false;
    showToast('Something went wrong — try again');
  }
});
</script>
</body>
</html>
