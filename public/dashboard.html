<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flara — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  :root {
    --p:#D4537E; --p50:#FBEAF0; --p100:#F4C0D1; --p600:#993556;
    --t:#1D9E75; --t50:#E1F5EE; --t100:#9FE1CB;
    --a:#BA7517; --a50:#FAEEDA;
    --ink:#1e1510; --ink2:#6b5f55; --ink3:#b0a49c;
    --cream:#faf7f4; --white:#ffffff;
    --shadow: 0 2px 20px rgba(30,21,16,.06);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--cream); min-height: 100vh; padding-bottom: 80px; }

  /* Topbar */
  .topbar { padding: 18px 20px 0; display: flex; align-items: center; justify-content: space-between; }
  .logo { font-family: 'Fraunces', serif; font-size: 20px; font-weight: 300; color: var(--p); }
  .topbar-right { display: flex; align-items: center; gap: 10px; }
  .avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--p100); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 500; color: var(--p600); cursor: pointer; }

  /* Greeting */
  .greeting { padding: 20px 20px 0; }
  .g-date { font-size: 11px; font-weight: 500; color: var(--ink3); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 4px; }
  .g-title { font-size: 22px; font-weight: 500; color: var(--ink); line-height: 1.3; }
  .g-title em { color: var(--p); font-style: italic; font-family: 'Fraunces', serif; font-weight: 300; }

  /* Cards */
  .cards { padding: 16px 20px 0; display: flex; flex-direction: column; gap: 12px; }
  .card { background: var(--white); border-radius: 18px; padding: 16px; box-shadow: var(--shadow); border: 0.5px solid rgba(30,21,16,.06); }
  .clabel { font-size: 11px; font-weight: 500; color: var(--ink3); text-transform: uppercase; letter-spacing: .07em; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; }
  .clabel-left { display: flex; align-items: center; gap: 6px; }

  /* Log CTA */
  .log-cta { background: var(--p); border: none; border-radius: 16px; padding: 16px 18px; width: 100%; display: flex; align-items: center; justify-content: space-between; cursor: pointer; font-family: inherit; transition: opacity .15s; box-shadow: 0 4px 20px rgba(212,83,126,.25); }
  .log-cta:hover { opacity: .9; }
  .log-cta.logged { background: var(--t); box-shadow: 0 4px 20px rgba(29,158,117,.25); }
  .lc-left { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }
  .lc-title { font-size: 15px; font-weight: 500; color: #fff; }
  .lc-sub { font-size: 12px; color: rgba(255,255,255,.75); }
  .lc-icon { width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,.2); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 18px; }

  /* Streak */
  .streak-row { display: flex; align-items: center; gap: 14px; }
  .streak-num { font-size: 48px; font-weight: 500; color: var(--p); line-height: 1; font-family: 'Fraunces', serif; }
  .streak-info { flex: 1; }
  .streak-title { font-size: 15px; font-weight: 500; color: var(--ink); margin-bottom: 2px; }
  .streak-sub { font-size: 12px; color: var(--ink2); line-height: 1.5; }
  .streak-fire { font-size: 32px; }

  /* Week dots */
  .week-row { display: flex; gap: 6px; margin-top: 14px; }
  .wday { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; }
  .wdot { width: 30px; height: 30px; border-radius: 50%; border: 0.5px solid rgba(30,21,16,.1); display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 500; }
  .wdot.good { background: var(--t50); color: #085041; border-color: var(--t100); }
  .wdot.ok { background: var(--a50); color: #633806; border-color: #FAC775; }
  .wdot.hard { background: var(--p50); color: var(--p600); border-color: var(--p100); }
  .wdot.empty { background: var(--cream); }
  .wdot.today { background: var(--p); color: #fff; border-color: var(--p); }
  .wlabel { font-size: 10px; color: var(--ink3); font-weight: 500; }

  /* Stats grid */
  .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stat { background: var(--cream); border-radius: 12px; padding: 12px; }
  .stat-num { font-size: 22px; font-weight: 500; color: var(--ink); }
  .stat-label { font-size: 11px; color: var(--ink2); margin-top: 2px; }
  .stat.rose .stat-num { color: var(--p); }
  .stat.teal .stat-num { color: var(--t); }

  /* Chart */
  .chart-wrap { position: relative; height: 120px; }

  /* Insight preview */
  .insight-box { background: linear-gradient(135deg, #2a1a20 0%, #1a1510 100%); border-radius: 16px; padding: 16px; cursor: pointer; transition: opacity .15s; }
  .insight-box:hover { opacity: .9; }
  .ib-label { font-size: 11px; font-weight: 500; color: var(--p100); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 8px; display: flex; align-items: center; gap: 5px; }
  .ib-text { font-size: 13px; color: #f0e8e4; line-height: 1.7; font-family: 'Fraunces', serif; font-style: italic; }
  .ib-empty { font-size: 13px; color: rgba(240,232,228,.5); font-style: italic; font-family: 'Fraunces', serif; }

  /* Bottom nav */
  .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--white); border-top: 0.5px solid rgba(30,21,16,.08); display: flex; padding: 8px 0 4px; z-index: 100; }
  .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; padding: 4px; color: var(--ink3); font-size: 10px; font-weight: 500; border: none; background: none; font-family: inherit; transition: color .15s; }
  .nav-item i { font-size: 20px; }
  .nav-item.active { color: var(--p); }
  .nav-fab-wrap { flex: 1; display: flex; justify-content: center; }
  .nav-fab { width: 46px; height: 46px; border-radius: 50%; background: var(--p); border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #fff; font-size: 22px; margin-top: -18px; box-shadow: 0 4px 16px rgba(212,83,126,.35); transition: opacity .15s; font-family: inherit; }
  .nav-fab:hover { opacity: .9; }

  /* Loading skeleton */
  .skeleton { background: linear-gradient(90deg, var(--cream) 25%, #f0ebe6 50%, var(--cream) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 8px; }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

  /* Empty state */
  .empty { text-align: center; padding: 20px; color: var(--ink3); font-size: 13px; line-height: 1.6; }

  /* Signout */
  .signout-btn { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink3); background: none; border: none; cursor: pointer; font-family: inherit; padding: 4px; }
  .signout-btn:hover { color: var(--p); }
</style>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
</head>
<body>

<div class="topbar">
  <div class="logo">flara</div>
  <div class="topbar-right">
    <button class="signout-btn" onclick="signOut()"><i class="ti ti-logout"></i></button>
    <div class="avatar" id="avatarEl">—</div>
  </div>
</div>

<div class="greeting">
  <div class="g-date" id="dateEl"></div>
  <div class="g-title" id="greetingEl">Loading<em>…</em></div>
</div>

<div class="cards">

  <button class="log-cta" id="logCta" onclick="goToLog()">
    <div class="lc-left">
      <div class="lc-title" id="ctaTitle">Log today's symptoms</div>
      <div class="lc-sub" id="ctaSub">Takes under 60 seconds</div>
    </div>
    <div class="lc-icon"><i class="ti ti-plus" id="ctaIcon"></i></div>
  </button>

  <div class="card">
    <div class="clabel">
      <div class="clabel-left"><i class="ti ti-flame" style="font-size:16px;color:var(--p)"></i> Streak</div>
    </div>
    <div class="streak-row">
      <div class="streak-num" id="streakNum">—</div>
      <div class="streak-info">
        <div class="streak-title" id="streakTitle">Loading…</div>
        <div class="streak-sub" id="streakSub"></div>
      </div>
      <div class="streak-fire" id="streakFire"></div>
    </div>
    <div class="week-row" id="weekRow"></div>
  </div>

  <div class="card">
    <div class="clabel">
      <div class="clabel-left"><i class="ti ti-chart-bar" style="font-size:16px"></i> This week</div>
    </div>
    <div class="stats-grid" id="statsGrid">
      <div class="stat skeleton" style="height:56px"></div>
      <div class="stat skeleton" style="height:56px"></div>
      <div class="stat skeleton" style="height:56px"></div>
      <div class="stat skeleton" style="height:56px"></div>
    </div>
  </div>

  <div class="card">
    <div class="clabel">
      <div class="clabel-left"><i class="ti ti-chart-line" style="font-size:16px"></i> Pain this week</div>
    </div>
    <div class="chart-wrap">
      <canvas id="painChart"></canvas>
    </div>
  </div>

  <div class="insight-box" id="insightBox">
    <div class="ib-label"><i class="ti ti-sparkles"></i> Latest insight</div>
    <div class="ib-text ib-empty" id="insightText">Log a few days to unlock AI-powered insights about your patterns.</div>
  </div>

</div>

<nav class="bottom-nav">
  <button class="nav-item active"><i class="ti ti-home"></i>Home</button>
  <button class="nav-item" onclick="goToLog()"><i class="ti ti-chart-line"></i>Trends</button>
  <div class="nav-fab-wrap"><button class="nav-fab" onclick="goToLog()"><i class="ti ti-plus"></i></button></div>
  <button class="nav-item"><i class="ti ti-users"></i>Community</button>
  <button class="nav-item"><i class="ti ti-user"></i>Profile</button>
</nav>

<script>
const SUPABASE_URL = 'https://eksywmdtyjhfnrvxmdku.supabase.co';
const SUPABASE_KEY = 'sb_publishable_LGlQ_iISN3DmP5lto2QCKA_2yP2OMQe';

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: { detectSessionInUrl: true, persistSession: true, autoRefreshToken: true }
});

const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const now = new Date();

document.getElementById('dateEl').textContent =
  days[now.getDay()] + ', ' + months[now.getMonth()] + ' ' + now.getDate();

function goToLog() { window.location.href = '/log'; }

async function signOut() {
  await sb.auth.signOut();
  window.location.href = '/';
}

function getGreeting() {
  const h = now.getHours();
  if (h < 12) return 'Good morning';
  if (h < 17) return 'Good afternoon';
  return 'Good evening';
}

function buildWeekRow(logs) {
  const wr = document.getElementById('weekRow');
  wr.innerHTML = '';
  const dayLabels = ['M','T','W','T','F','S','S'];
  const today = now.getDay();
  const mondayOffset = today === 0 ? 6 : today - 1;

  for (let i = 0; i < 7; i++) {
    const d = new Date(now);
    d.setDate(now.getDate() - mondayOffset + i);
    const dateStr = d.toISOString().split('T')[0];
    const log = logs.find(l => l.log_date === dateStr);
    const isToday = dateStr === now.toISOString().split('T')[0];

    const col = document.createElement('div');
    col.className = 'wday';

    const dot = document.createElement('div');
    if (isToday && !log) {
      dot.className = 'wdot today';
      dot.textContent = '•';
    } else if (log) {
      const p = log.pain_level;
      dot.className = 'wdot ' + (p <= 3 ? 'good' : p <= 6 ? 'ok' : 'hard');
      dot.textContent = p;
    } else {
      dot.className = 'wdot empty';
    }

    const lbl = document.createElement('div');
    lbl.className = 'wlabel';
    lbl.textContent = dayLabels[i];

    col.appendChild(dot);
    col.appendChild(lbl);
    wr.appendChild(col);
  }
}

function buildStats(logs) {
  const grid = document.getElementById('statsGrid');
  if (!logs.length) {
    grid.innerHTML = '<div class="empty" style="grid-column:1/-1">Log your first day to see stats here.</div>';
    return;
  }
  const avg = (arr, key) => (arr.reduce((s, l) => s + (l[key] || 0), 0) / arr.length).toFixed(1);
  const todayLog = logs.find(l => l.log_date === now.toISOString().split('T')[0]);
  grid.innerHTML = `
    <div class="stat rose"><div class="stat-num">${avg(logs,'pain_level')}</div><div class="stat-label">Avg pain</div></div>
    <div class="stat teal"><div class="stat-num">${avg(logs,'energy_level')}</div><div class="stat-label">Avg energy</div></div>
    <div class="stat"><div class="stat-num">${avg(logs,'sleep_hours')}h</div><div class="stat-label">Avg sleep</div></div>
    <div class="stat"><div class="stat-num">${todayLog?.cycle_day ? 'Day '+todayLog.cycle_day : '—'}</div><div class="stat-label">Cycle day</div></div>
  `;
}

function buildChart(logs) {
  if (!logs.length) return;
  const sorted = [...logs].sort((a,b) => a.log_date.localeCompare(b.log_date));
  const labels = sorted.map(l => {
    const d = new Date(l.log_date);
    return days[d.getDay()];
  });
  const data = sorted.map(l => l.pain_level);

  new Chart(document.getElementById('painChart'), {
    type: 'line',
    data: {
      labels,
      datasets: [{
        data,
        borderColor: '#D4537E',
        backgroundColor: 'rgba(212,83,126,.08)',
        borderWidth: 2,
        pointBackgroundColor: '#D4537E',
        pointRadius: 4,
        fill: true,
        tension: 0.4
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        y: { min: 0, max: 10, ticks: { stepSize: 5, font: { size: 10 } }, grid: { color: 'rgba(0,0,0,.05)' } },
        x: { ticks: { font: { size: 10 } }, grid: { display: false } }
      }
    }
  });
}

function buildStreak(logs) {
  const dates = logs.map(l => l.log_date).sort().reverse();
  let streak = 0;
  const today = now.toISOString().split('T')[0];
  let check = new Date(now);

  for (let i = 0; i < 30; i++) {
    const dateStr = check.toISOString().split('T')[0];
    if (dates.includes(dateStr)) {
      streak++;
      check.setDate(check.getDate() - 1);
    } else if (dateStr === today) {
      check.setDate(check.getDate() - 1);
    } else {
      break;
    }
  }

  document.getElementById('streakNum').textContent = streak;
  document.getElementById('streakFire').textContent = streak >= 3 ? '🔥' : streak >= 1 ? '✨' : '';
  document.getElementById('streakTitle').textContent =
    streak === 0 ? 'Start your streak today' :
    streak === 1 ? '1 day logged' :
    streak + ' days in a row';
  document.getElementById('streakSub').textContent =
    streak >= 7 ? 'Your AI insights are getting powerful.' :
    streak >= 3 ? 'Keep going — patterns emerge at 7 days.' :
    'Log every day to build your health picture.';
}

function updateLogCTA(logs) {
  const todayLogged = logs.some(l => l.log_date === now.toISOString().split('T')[0]);
  if (todayLogged) {
    document.getElementById('logCta').classList.add('logged');
    document.getElementById('ctaTitle').textContent = "Today's log saved ✓";
    document.getElementById('ctaSub').textContent = 'Come back tomorrow';
    document.getElementById('ctaIcon').className = 'ti ti-check';
  }
}

function showInsight(logs) {
  const withInsight = logs.filter(l => l.ai_insight).sort((a,b) => b.log_date.localeCompare(a.log_date));
  if (withInsight.length) {
    const el = document.getElementById('insightText');
    el.classList.remove('ib-empty');
    el.textContent = withInsight[0].ai_insight;
  }
}

async function loadDashboard() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { window.location.href = '/'; return; }

  const user = session.user;
  const name = user.user_metadata?.full_name?.split(' ')[0] || 'there';

  document.getElementById('greetingEl').innerHTML =
    getGreeting() + ',<br><em>' + name + '</em>';
  document.getElementById('avatarEl').textContent = name[0].toUpperCase();

  // Load last 7 days of logs
  const sevenDaysAgo = new Date(now);
  sevenDaysAgo.setDate(now.getDate() - 6);
  const fromDate = sevenDaysAgo.toISOString().split('T')[0];

  const { data: logs, error } = await sb
    .from('symptom_logs')
    .select('*')
    .eq('user_id', user.id)
    .gte('log_date', fromDate)
    .order('log_date', { ascending: false });

  const safelogs = logs || [];

  buildStreak(safelogs);
  buildWeekRow(safelogs);
  buildStats(safelogs);
  buildChart(safelogs);
  updateLogCTA(safelogs);
  showInsight(safelogs);
}

loadDashboard();
</script>
</body>
</html>
