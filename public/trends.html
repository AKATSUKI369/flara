<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flara — Trends</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
  :root {
    --p:#D4537E; --p50:#FBEAF0; --p100:#F4C0D1; --p600:#993556;
    --t:#1D9E75; --t50:#E1F5EE; --t100:#9FE1CB;
    --a:#BA7517; --a50:#FAEEDA;
    --ink:#1e1510; --ink2:#6b5f55; --ink3:#b0a49c;
    --cream:#faf7f4; --white:#ffffff;
    --shadow: 0 2px 20px rgba(30,21,16,.06);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--cream); min-height: 100vh; padding-bottom: 80px; }

  /* Topbar */
  .topbar { padding: 18px 20px 0; display: flex; align-items: center; justify-content: space-between; }
  .logo { font-family: 'Fraunces', serif; font-size: 20px; font-weight: 300; color: var(--p); }

  /* Greeting */
  .hero { padding: 20px 20px 0; }
  .hero-title { font-size: 22px; font-weight: 500; color: var(--ink); line-height: 1.3; margin-bottom: 4px; }
  .hero-title em { color: var(--p); font-style: italic; font-family: 'Fraunces', serif; font-weight: 300; }
  .hero-sub { font-size: 13px; color: var(--ink2); }

  /* Range pills */
  .range-wrap { padding: 16px 20px 0; }
  .range-row { display: flex; gap: 6px; }
  .range-btn { flex: 1; padding: 9px 4px; border-radius: 10px; border: 0.5px solid rgba(30,21,16,.1); background: var(--white); font-size: 12px; font-weight: 500; color: var(--ink2); cursor: pointer; font-family: inherit; transition: all .15s; }
  .range-btn.active { background: var(--p); border-color: var(--p); color: #fff; }

  /* Cards */
  .cards { padding: 14px 20px 0; display: flex; flex-direction: column; gap: 12px; }
  .card { background: var(--white); border-radius: 18px; padding: 16px; box-shadow: var(--shadow); border: 0.5px solid rgba(30,21,16,.06); }
  .clabel { font-size: 11px; font-weight: 500; color: var(--ink3); text-transform: uppercase; letter-spacing: .07em; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }

  /* Stats grid */
  .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stat { background: var(--cream); border-radius: 12px; padding: 12px; }
  .stat-num { font-size: 22px; font-weight: 500; color: var(--ink); }
  .stat-label { font-size: 11px; color: var(--ink2); margin-top: 2px; }
  .stat.rose .stat-num { color: var(--p); }
  .stat.teal .stat-num { color: var(--t); }
  .stat.amber .stat-num { color: var(--a); }
  .stat-delta { display: inline-block; font-size: 10px; font-weight: 500; margin-top: 4px; padding: 2px 6px; border-radius: 99px; }
  .stat-delta.up { background: #fde8ee; color: #c9426a; }
  .stat-delta.down { background: var(--t50); color: #085041; }
  .stat-delta.flat { background: var(--cream); color: var(--ink3); border: 0.5px solid rgba(30,21,16,.08); }

  /* Chart */
  .chart-wrap { position: relative; height: 160px; }
  .chart-wrap.tall { height: 200px; }

  /* Symptom bars */
  .sym-row { display: flex; flex-direction: column; gap: 10px; }
  .sym-item { display: flex; align-items: center; gap: 10px; }
  .sym-name { font-size: 12px; color: var(--ink2); width: 70px; flex-shrink: 0; }
  .sym-bar-wrap { flex: 1; height: 8px; background: var(--cream); border-radius: 99px; overflow: hidden; }
  .sym-bar { height: 100%; border-radius: 99px; background: var(--p); transition: width .4s ease; }
  .sym-pct { font-size: 12px; font-weight: 500; color: var(--ink2); width: 32px; text-align: right; flex-shrink: 0; }

  /* Heatmap */
  .heatmap { display: grid; grid-template-columns: 64px repeat(7, 1fr); gap: 3px; }
  .hm-corner { }
  .hm-day { font-size: 10px; color: var(--ink3); text-align: center; font-weight: 500; padding-bottom: 4px; }
  .hm-label { font-size: 10px; color: var(--ink3); font-weight: 500; display: flex; align-items: center; }
  .hm-cell { height: 26px; border-radius: 5px; cursor: default; transition: transform .1s; }
  .hm-cell:hover { transform: scale(1.1); }

  /* Insight */
  .insight-box { background: linear-gradient(135deg, #2a1a20 0%, #1a1510 100%); border-radius: 16px; padding: 16px; }
  .ib-label { font-size: 11px; font-weight: 500; color: var(--p100); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 8px; display: flex; align-items: center; gap: 5px; }
  .ib-text { font-size: 13px; color: #f0e8e4; line-height: 1.7; font-family: 'Fraunces', serif; font-style: italic; }

  /* Log table */
  .log-list { display: flex; flex-direction: column; gap: 0; }
  .log-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 0.5px solid rgba(30,21,16,.06); }
  .log-row:last-child { border-bottom: none; }
  .log-date { font-size: 12px; font-weight: 500; color: var(--ink); min-width: 72px; }
  .log-badges { display: flex; gap: 5px; flex-wrap: wrap; flex: 1; }
  .badge { font-size: 11px; font-weight: 500; padding: 3px 8px; border-radius: 99px; }
  .badge-pain-low  { background: var(--t50); color: #085041; }
  .badge-pain-mid  { background: var(--a50); color: var(--a); }
  .badge-pain-high { background: var(--p50); color: var(--p600); }
  .badge-sym { background: rgba(30,21,16,.06); color: var(--ink2); }

  /* Loading / empty */
  .loading-state { text-align: center; padding: 40px 20px; color: var(--ink3); font-size: 13px; }
  .spinner { width: 28px; height: 28px; border-radius: 50%; border: 2.5px solid var(--p100); border-top-color: var(--p); animation: spin .8s linear infinite; margin: 0 auto 12px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .empty-state { text-align: center; padding: 40px 20px; }
  .empty-icon { font-size: 36px; margin-bottom: 10px; }
  .empty-text { font-size: 13px; color: var(--ink2); line-height: 1.6; margin-bottom: 16px; }
  .go-log-btn { display: inline-block; padding: 12px 24px; background: var(--p); color: #fff; border-radius: 12px; font-size: 14px; font-weight: 500; text-decoration: none; }

  /* Bottom nav */
  .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--white); border-top: 0.5px solid rgba(30,21,16,.08); display: flex; padding: 8px 0 4px; z-index: 100; }
  .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; padding: 4px; color: var(--ink3); font-size: 10px; font-weight: 500; border: none; background: none; font-family: inherit; transition: color .15s; }
  .nav-item i { font-size: 20px; }
  .nav-item.active { color: var(--p); }
  .nav-fab-wrap { flex: 1; display: flex; justify-content: center; }
  .nav-fab { width: 46px; height: 46px; border-radius: 50%; background: var(--p); border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #fff; font-size: 22px; margin-top: -18px; box-shadow: 0 4px 16px rgba(212,83,126,.35); transition: opacity .15s; font-family: inherit; }
  .nav-fab:hover { opacity: .9; }
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">flara</div>
</div>

<div class="hero">
  <div class="hero-title">Your <em>trends</em></div>
  <div class="hero-sub" id="heroSub">Loading your data…</div>
</div>

<div class="range-wrap">
  <div class="range-row" id="rangeRow">
    <button class="range-btn" data-d="7">7 days</button>
    <button class="range-btn active" data-d="30">30 days</button>
    <button class="range-btn" data-d="90">3 months</button>
    <button class="range-btn" data-d="180">6 months</button>
  </div>
</div>

<div class="cards" id="mainContent">
  <div class="loading-state">
    <div class="spinner"></div>
    Fetching your logs…
  </div>
</div>

<!-- Bottom nav -->
<nav class="bottom-nav">
  <button class="nav-item" onclick="window.location.href='/dashboard'"><i class="ti ti-home"></i>Home</button>
  <button class="nav-item active"><i class="ti ti-chart-line"></i>Trends</button>
  <div class="nav-fab-wrap"><button class="nav-fab" onclick="window.location.href='/log'"><i class="ti ti-plus"></i></button></div>
  <button class="nav-item" onclick="window.location.href='/report'"><i class="ti ti-file-download"></i>Report</button>
  <button class="nav-item"><i class="ti ti-user"></i>Profile</button>
</nav>

<script>
const SUPABASE_URL = 'https://eksywmdtyjhfnrvxmdku.supabase.co';
const SUPABASE_KEY = 'sb_publishable_LGlQ_iISN3DmP5lto2QCKA_2yP2OMQe';

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: { detectSessionInUrl: true, persistSession: true, autoRefreshToken: true }
});

let allLogs = [];
let rangeDays = 30;
let charts = {};

/* ── helpers ── */
function avg(arr, key) {
  const vals = arr.map(r => parseFloat(r[key])).filter(v => !isNaN(v));
  return vals.length ? (vals.reduce((a,b) => a+b, 0) / vals.length) : null;
}
function fmt(v, d=1) { return v == null ? '—' : v.toFixed(d); }
function filterLogs(logs, days) {
  const cutoff = new Date();
  cutoff.setDate(cutoff.getDate() - days);
  return logs.filter(l => new Date(l.log_date) >= cutoff);
}
function destroyChart(key) {
  if (charts[key]) { charts[key].destroy(); delete charts[key]; }
}

/* ── delta badge ── */
function deltaBadge(curr, prev, lowerBetter=false) {
  if (curr == null || prev == null || prev === 0) return '<span class="stat-delta flat">—</span>';
  const diff = curr - prev;
  const pct = Math.abs(diff / prev * 100).toFixed(0);
  if (Math.abs(diff) < 0.05) return '<span class="stat-delta flat">→ same</span>';
  const better = lowerBetter ? diff < 0 : diff > 0;
  const cls = better ? 'down' : 'up';
  const arrow = diff > 0 ? '↑' : '↓';
  return `<span class="stat-delta ${cls}">${arrow} ${pct}%</span>`;
}

/* ── pain badge ── */
function painBadge(v) {
  if (v == null) return '';
  if (v <= 3) return `<span class="badge badge-pain-low">Pain ${v}</span>`;
  if (v <= 6) return `<span class="badge badge-pain-mid">Pain ${v}</span>`;
  return `<span class="badge badge-pain-high">Pain ${v}</span>`;
}

/* ── render ── */
function render() {
  const filtered = filterLogs(allLogs, rangeDays);

  // prev period for deltas
  const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - rangeDays);
  const prevCutoff = new Date(cutoff); prevCutoff.setDate(prevCutoff.getDate() - rangeDays);
  const prev = allLogs.filter(l => { const d = new Date(l.log_date); return d >= prevCutoff && d < cutoff; });

  document.getElementById('heroSub').textContent = filtered.length
    ? `${filtered.length} logs in the last ${rangeDays} days`
    : `No logs in this range`;

  if (!filtered.length) {
    document.getElementById('mainContent').innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">📈</div>
        <div class="empty-text">No logs in this period yet.<br>Keep tracking and patterns will appear here.</div>
        <a href="/log" class="go-log-btn">Log today →</a>
      </div>`;
    return;
  }

  const pain   = avg(filtered, 'pain_level');
  const energy = avg(filtered, 'energy_level');
  const sleep  = avg(filtered, 'sleep_hours');
  const mood   = avg(filtered, 'mood');
  const pPain  = avg(prev, 'pain_level');
  const pEnergy= avg(prev, 'energy_level');
  const pSleep = avg(prev, 'sleep_hours');
  const pMood  = avg(prev, 'mood');

  const sorted = [...filtered].sort((a,b) => a.log_date.localeCompare(b.log_date));
  const labels = sorted.map(l => { const d=new Date(l.log_date); return (d.getMonth()+1)+'/'+d.getDate(); });

  const bloatingDays = filtered.filter(l=>l.bloating).length;
  const headacheDays = filtered.filter(l=>l.headache).length;
  const fogDays      = filtered.filter(l=>l.brain_fog).length;
  const total        = filtered.length;

  // insight
  const insights = [];
  const highPain = filtered.filter(l=>l.pain_level>=6);
  const lowSleepHP = highPain.filter(l=>parseFloat(l.sleep_hours)<6);
  if (highPain.length>=2 && lowSleepHP.length/highPain.length > 0.4)
    insights.push(`On ${lowSleepHP.length} of your high-pain days you slept under 6 hours — poor sleep amplifies pain signals. Prioritising rest on hard days could really help.`);

  const dowCounts = Array(7).fill(0);
  filtered.filter(l=>l.pain_level>=6).forEach(l => { dowCounts[(new Date(l.log_date).getDay()+6)%7]++; });
  const worstDow = dowCounts.indexOf(Math.max(...dowCounts));
  const dayNames = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
  if (dowCounts[worstDow]>=2)
    insights.push(`${dayNames[worstDow]}s tend to be your toughest days — ${dowCounts[worstDow]} high-pain ${dayNames[worstDow]}s in this period. Consider lighter plans that day.`);

  if (!insights.length)
    insights.push(`Your average pain is ${fmt(pain)}/10 across ${total} logs. Keep tracking daily — after 2 weeks patterns become much clearer and more actionable.`);

  document.getElementById('mainContent').innerHTML = `

    <!-- Stats -->
    <div class="card">
      <div class="clabel"><i class="ti ti-chart-bar"></i> Averages</div>
      <div class="stats-grid">
        <div class="stat rose">
          <div class="stat-num">${fmt(pain)}<span style="font-size:13px;color:var(--ink3)">/10</span></div>
          <div class="stat-label">Avg pain</div>
          ${deltaBadge(pain, pPain, true)}
        </div>
        <div class="stat teal">
          <div class="stat-num">${fmt(energy)}<span style="font-size:13px;color:var(--ink3)">/10</span></div>
          <div class="stat-label">Avg energy</div>
          ${deltaBadge(energy, pEnergy, false)}
        </div>
        <div class="stat">
          <div class="stat-num">${fmt(sleep)}<span style="font-size:13px;color:var(--ink3)">h</span></div>
          <div class="stat-label">Avg sleep</div>
          ${deltaBadge(sleep, pSleep, false)}
        </div>
        <div class="stat amber">
          <div class="stat-num">${fmt(mood)}<span style="font-size:13px;color:var(--ink3)">/10</span></div>
          <div class="stat-label">Avg mood</div>
          ${deltaBadge(mood, pMood, false)}
        </div>
      </div>
    </div>

    <!-- Overview chart -->
    <div class="card">
      <div class="clabel"><i class="ti ti-chart-line"></i> Pain · Energy · Mood</div>
      <div class="chart-wrap tall"><canvas id="chartOverview"></canvas></div>
    </div>

    <!-- Sleep chart -->
    <div class="card">
      <div class="clabel"><i class="ti ti-moon"></i> Sleep</div>
      <div class="chart-wrap"><canvas id="chartSleep"></canvas></div>
    </div>

    <!-- Symptom frequency -->
    <div class="card">
      <div class="clabel"><i class="ti ti-map-pin"></i> Symptom frequency</div>
      <div class="sym-row">
        <div class="sym-item">
          <div class="sym-name">Bloating</div>
          <div class="sym-bar-wrap"><div class="sym-bar" style="width:${total?bloatingDays/total*100:0}%;background:var(--p)"></div></div>
          <div class="sym-pct">${total?Math.round(bloatingDays/total*100):0}%</div>
        </div>
        <div class="sym-item">
          <div class="sym-name">Headache</div>
          <div class="sym-bar-wrap"><div class="sym-bar" style="width:${total?headacheDays/total*100:0}%;background:#8b6abf"></div></div>
          <div class="sym-pct">${total?Math.round(headacheDays/total*100):0}%</div>
        </div>
        <div class="sym-item">
          <div class="sym-name">Brain fog</div>
          <div class="sym-bar-wrap"><div class="sym-bar" style="width:${total?fogDays/total*100:0}%;background:#5ba6c9"></div></div>
          <div class="sym-pct">${total?Math.round(fogDays/total*100):0}%</div>
        </div>
      </div>
    </div>

    <!-- Heatmap -->
    <div class="card">
      <div class="clabel"><i class="ti ti-calendar"></i> Day-of-week heatmap</div>
      <div id="heatmapEl"></div>
    </div>

    <!-- Insight -->
    <div class="insight-box">
      <div class="ib-label"><i class="ti ti-sparkles"></i> Pattern spotted</div>
      <div class="ib-text">${insights[0]}</div>
    </div>

    <!-- Log history -->
    <div class="card">
      <div class="clabel"><i class="ti ti-list"></i> Log history</div>
      <div class="log-list" id="logList"></div>
    </div>

  `;

  // Chart: overview
  destroyChart('overview');
  charts.overview = new Chart(document.getElementById('chartOverview'), {
    type: 'line',
    data: {
      labels,
      datasets: [
        { label:'Pain', data: sorted.map(l=>l.pain_level), borderColor:'#D4537E', backgroundColor:'rgba(212,83,126,.08)', borderWidth:2, tension:0.4, pointRadius: sorted.length>30?0:3, fill:true },
        { label:'Energy', data: sorted.map(l=>l.energy_level), borderColor:'#1D9E75', backgroundColor:'transparent', borderWidth:2, tension:0.4, pointRadius: sorted.length>30?0:3 },
        { label:'Mood', data: sorted.map(l=>l.mood), borderColor:'#8b6abf', backgroundColor:'transparent', borderWidth:2, tension:0.4, pointRadius: sorted.length>30?0:3 },
      ]
    },
    options: {
      responsive:true, maintainAspectRatio:false,
      interaction:{ mode:'index', intersect:false },
      plugins:{ legend:{ labels:{ boxWidth:10, padding:12, font:{size:11,family:'DM Sans'} } }, tooltip:{ backgroundColor:'#1e1510', padding:10, cornerRadius:8 } },
      scales:{
        x:{ grid:{ color:'rgba(0,0,0,.04)' }, ticks:{ font:{size:10}, maxTicksLimit:8 } },
        y:{ grid:{ color:'rgba(0,0,0,.04)' }, min:0, max:10, ticks:{ stepSize:2, font:{size:10} } }
      }
    }
  });

  // Chart: sleep
  destroyChart('sleep');
  charts.sleep = new Chart(document.getElementById('chartSleep'), {
    type:'bar',
    data:{
      labels,
      datasets:[{ label:'Sleep', data: sorted.map(l=>parseFloat(l.sleep_hours)),
        backgroundColor: sorted.map(l => parseFloat(l.sleep_hours)>=7?'#1D9E75':parseFloat(l.sleep_hours)>=5?'#BA7517':'#D4537E'),
        borderRadius:4 }]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{display:false}, tooltip:{ backgroundColor:'#1e1510', callbacks:{ label: c=>`${c.parsed.y}h` } } },
      scales:{
        x:{ grid:{display:false}, ticks:{font:{size:10}, maxTicksLimit:8} },
        y:{ grid:{color:'rgba(0,0,0,.04)'}, min:0, max:12, ticks:{font:{size:10}, callback:v=>v+'h'} }
      }
    }
  });

  // Heatmap
  renderHeatmap(filtered);

  // Log list
  const logList = document.getElementById('logList');
  const reversed = [...sorted].reverse();
  logList.innerHTML = reversed.map(l => {
    const d = new Date(l.log_date);
    const dateStr = d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
    const syms = [];
    if(l.bloating) syms.push('Bloating');
    if(l.headache) syms.push('Headache');
    if(l.brain_fog) syms.push('Brain fog');
    return `<div class="log-row">
      <div class="log-date">${dateStr}</div>
      <div class="log-badges">
        ${painBadge(l.pain_level)}
        <span class="badge badge-sym">⚡ ${l.energy_level}</span>
        <span class="badge badge-sym">💤 ${parseFloat(l.sleep_hours)}h</span>
        ${syms.map(s=>`<span class="badge badge-sym">${s}</span>`).join('')}
      </div>
    </div>`;
  }).join('');
}

function renderHeatmap(filtered) {
  const el = document.getElementById('heatmapEl');
  const dayLabels = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const metrics = [
    { key:'pain_level', label:'Pain', palette:['#d6f0e3','#D4537E'] },
    { key:'energy_level', label:'Energy', palette:['#f0ece8','#1D9E75'] },
    { key:'sleep_hours', label:'Sleep', palette:['#f0ece8','#5ba6c9'] },
  ];

  // bucket by DOW
  const buckets = Array.from({length:7}, ()=>({pain_level:[],energy_level:[],sleep_hours:[]}));
  filtered.forEach(l => {
    const dow = (new Date(l.log_date).getDay()+6)%7;
    if(l.pain_level!=null) buckets[dow].pain_level.push(parseFloat(l.pain_level));
    if(l.energy_level!=null) buckets[dow].energy_level.push(parseFloat(l.energy_level));
    if(l.sleep_hours!=null) buckets[dow].sleep_hours.push(parseFloat(l.sleep_hours));
  });

  function interp(p, t) {
    const hex2rgb = h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
    const [r1,g1,b1]=hex2rgb(p[0]), [r2,g2,b2]=hex2rgb(p[1]);
    return `rgb(${Math.round(r1+(r2-r1)*t)},${Math.round(g1+(g2-g1)*t)},${Math.round(b1+(b2-b1)*t)})`;
  }

  let html = '<div class="heatmap">';
  html += '<div class="hm-corner"></div>';
  dayLabels.forEach(d => { html += `<div class="hm-day">${d}</div>`; });

  metrics.forEach(m => {
    html += `<div class="hm-label">${m.label}</div>`;
    dayLabels.forEach((_,i) => {
      const vals = buckets[i][m.key];
      if (!vals.length) { html += `<div class="hm-cell" style="background:#f0ece8" title="No data"></div>`; return; }
      const a = vals.reduce((x,y)=>x+y,0)/vals.length;
      const t = Math.min(a/10,1);
      const color = interp(m.palette, t);
      html += `<div class="hm-cell" style="background:${color}" title="${m.label} ${dayLabels[i]}: ${a.toFixed(1)}"></div>`;
    });
  });
  html += '</div>';
  el.innerHTML = html;
}

/* ── range buttons ── */
document.getElementById('rangeRow').addEventListener('click', e => {
  const b = e.target.closest('.range-btn'); if(!b) return;
  document.querySelectorAll('.range-btn').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  rangeDays = +b.dataset.d;
  render();
});

/* ── boot ── */
(async () => {
  const { data:{ session } } = await sb.auth.getSession();
  if (!session) { window.location.href='/'; return; }

  const { data, error } = await sb
    .from('symptom_logs')
    .select('*')
    .eq('user_id', session.user.id)
    .order('log_date', { ascending: true });

  if (error || !data?.length) {
    document.getElementById('mainContent').innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">📈</div>
        <div class="empty-text">No logs yet.<br>Start tracking daily and your trends will appear here.</div>
        <a href="/log" class="go-log-btn">Log today →</a>
      </div>`;
    document.getElementById('heroSub').textContent = 'No logs yet';
    return;
  }

  allLogs = data;
  render();
})();
</script>
</body>
</html>
